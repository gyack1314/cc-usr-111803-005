<!doctype html><html lang="zh"><meta charset="utf-8"><title>门店演练页</title>
<body><h1>门店资料</h1><button type="button" id="switch">切换</button>
<div id="card">猪肉 14.8 元</div><pre id="state"></pre>
<script>
let state={scope:"北方门店",card_scope:"北方门店",phase:'loaded'};
const show=()=>document.querySelector('#state').textContent=JSON.stringify(state);
show();
document.querySelector('#switch').onclick=()=>{
  state.scope="南方门店"; state.phase='pending'; show();
  setTimeout(()=>{state.card_scope=state.scope; state.phase='loaded';
    document.querySelector('#card').textContent="猪肉 15.1 元"; show();},300);
};
</script></body></html>
